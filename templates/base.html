<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LearnPath AI{% if page %} · {{ page|title }}{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="grain"></div>
  <header class="top">
    <a class="brand" href="/">
      <span class="mark">LP</span>
      LearnPath <em>AI</em>
    </a>
    <nav>
      <a href="/" class="{{ 'on' if page=='home' }}">Studio</a>
      <a href="/chat" class="{{ 'on' if page=='chat' }}">Coach</a>
      <a href="/path" class="{{ 'on' if page=='path' }}">Roadmap</a>
      <a href="/dashboard" class="{{ 'on' if page=='dashboard' }}">Progress</a>
      <a href="/quiz" class="{{ 'on' if page=='quiz' }}">Quiz</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    Hybrid ranker · NetworkX paths · Optional OpenAI · Built for personalized curricula
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
