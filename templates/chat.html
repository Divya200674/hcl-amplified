{% extends "base.html" %}
{% block content %}
<section class="split">
  <div>
    <p class="eyebrow">Coach</p>
    <h1>Talk like a human.<br>Leave with a plan.</h1>
    <div class="chat-log" id="chat-log"></div>
    <form class="composer" id="chat-form">
      <input id="chat-input" autocomplete="off" placeholder="I know Python and want to become a data scientist in 6 months…" />
      <button class="btn primary" type="submit">Send</button>
    </form>
    <div class="chips" id="prompts"></div>
  </div>
  <aside class="panel">
    <h3>Constraints</h3>
    <label>Name <input id="p-name" /></label>
    <label>Level
      <select id="p-level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </label>
    <label>Hours / week <input id="p-hours" type="range" min="3" max="30" /> <b id="p-hours-val">10</b></label>
    <label>Style
      <select id="p-style">
        <option value="hands-on">Hands-on</option>
        <option value="video">Video</option>
        <option value="reading">Reading</option>
      </select>
    </label>
    <button class="btn primary" id="save-profile" type="button">Save settings</button>
    <p class="hint">Settings override chat guesses so the calendar stays honest.</p>
  </aside>
</section>
{% endblock %}
{% block scripts %}
<script>bootChat();</script>
{% endblock %}
